name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # La lógica vive en HolaMundo.Core y se prueba sin emulador ni workload de MAUI.
      - run: dotnet test HolaMundo.Core.Tests -c Release
